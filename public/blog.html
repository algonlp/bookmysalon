<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | QRschedule</title>
    <meta name="description" content="QRschedule blog." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="simple-page">
      <div class="simple-page-header">
        <a class="back-link" href="/" aria-label="Go back">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M15 5l-7 7 7 7"></path>
          </svg>
        </a>
        <a class="brand" href="/">QRschedule</a>
      </div>
      <section class="simple-page-card blog-hero-card">
        <p class="login-eyebrow">Blog</p>
        <h1>Ideas for growing salon bookings.</h1>
        <p>
          Guides, product updates, and salon growth tips from the QRschedule team.
        </p>
        <a class="pill-button fill" href="/">Explore salons</a>
      </section>
      <section class="public-blog-list" id="public-blog-list" aria-live="polite">
        <article class="sms-log-empty">
          <h2>No blog posts yet</h2>
          <p>Published posts will show here soon.</p>
        </article>
      </section>
    </main>
    <script src="/main.js"></script>
  </body>
</html>
